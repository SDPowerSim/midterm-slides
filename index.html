<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>SpecWatt Midterm Presentation</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #e7edf3; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
    #deck {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      transform-origin: center;
      background: #fff;
      box-shadow: 0 22px 70px rgba(24, 53, 85, .15);
    }
    .deck-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      visibility: hidden;
      pointer-events: none;
      background: #fff;
    }
    .deck-slide.active { visibility: visible; pointer-events: auto; }
    .deck-progress {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: rgba(22, 58, 99, .1);
    }
    .deck-progress span {
      display: block;
      width: 10%;
      height: 100%;
      background: #2f70b3;
      transition: width 220ms ease;
    }
    .deck-nav {
      position: fixed;
      top: 50%;
      z-index: 5;
      width: 44px;
      height: 64px;
      padding: 0;
      border: 0;
      border-radius: 7px;
      background: rgba(255, 255, 255, .76);
      color: #2f70b3;
      font: 600 30px/1 Arial, sans-serif;
      opacity: .15;
      cursor: pointer;
      transform: translateY(-50%);
      transition: opacity 150ms ease, background 150ms ease;
    }
    .deck-nav:hover, .deck-nav:focus-visible { opacity: 1; background: #fff; }
    .deck-nav:focus-visible { outline: 3px solid #2f70b3; outline-offset: 3px; }
    .deck-nav.prev { left: 13px; }
    .deck-nav.next { right: 13px; }
    @media print {
      html, body { overflow: visible; width: 1600px; height: auto; background: #fff; }
      #deck { position: static; transform: none !important; box-shadow: none; height: auto; overflow: visible; }
      .deck-slide { visibility: visible; display: block; position: relative; width: 1600px; height: 900px; break-after: page; page-break-after: always; }
      .deck-nav, .deck-progress { display: none; }
      @page { size: 1600px 900px; margin: 0; }
    }
  </style>
</head>
<body>
  <main id="deck" aria-label="SpecWatt midterm presentation">
    <iframe class="deck-slide active" src="slides/slide-01.html" title="Title" aria-hidden="false"></iframe>
    <iframe class="deck-slide" src="slides/slide-02.html" title="Research question" aria-hidden="true" inert></iframe>
    <iframe class="deck-slide" src="slides/slide-03.html" title="Evaluation pipeline" aria-hidden="true" inert></iframe>
    <iframe class="deck-slide" src="slides/slide-04.html" title="Workload and kernel geometry" aria-hidden="true" inert></iframe>
    <iframe class="deck-slide" src="slides/slide-05.html" title="Validation evidence" aria-hidden="true" inert></iframe>
    <iframe class="deck-slide" src="slides/slide-06.html" title="A30 step latency" aria-hidden="true" inert></iframe>
    <iframe class="deck-slide" src="slides/slide-07.html" title="A30 time per token" aria-hidden="true" inert></iframe>
    <iframe class="deck-slide" src="slides/slide-08.html" title="EnergAIzer coverage" aria-hidden="true" inert></iframe>
    <iframe class="deck-slide" src="slides/slide-09.html" title="Supported subset break-even" aria-hidden="true" inert></iframe>
    <iframe class="deck-slide" src="slides/slide-10.html" title="Midterm status and next steps" aria-hidden="true" inert></iframe>
  </main>
  <button class="deck-nav prev" type="button" aria-label="Previous slide">&#8249;</button>
  <button class="deck-nav next" type="button" aria-label="Next slide">&#8250;</button>
  <div class="deck-progress" aria-hidden="true"><span></span></div>
  <script src="scripts/deck.js"></script>
</body>
</html>
